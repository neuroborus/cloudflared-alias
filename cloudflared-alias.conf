# cloudflared-alias config. Env vars override. One option per line; # = comment.

# Mode when no -p/-s/-n flag: path | subdomain | no-key
DEFAULT_MODE=path

# Caddy listen port (cloudflared forwards to this)
CADDY_PORT=9090

# Random key length when key not provided (path/subdomain)
ID_LENGTH=4

# Run in background: 0 | 1
DETACH=0

# Optional: path to cloudflared config (tunnel, credentials, hostname)
# CLOUDFLARED_BASE_CONFIG=/path/to/cloudflared/config.yml

# Optional for subdomain mode: domain for <key>.<domain> (else from cloudflared hostname)
# SUBDOMAIN_DOMAIN=local.hasso.tech
